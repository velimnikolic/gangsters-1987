name: Offline source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s Tools/play -p 'test_*.py' -v
      - run: python3 Tools/project.py sizes --check
